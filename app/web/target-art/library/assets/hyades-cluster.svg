  <title id="hyades-cluster-title">Hyades Cluster</title>
  <desc id="hyades-cluster-desc">Original Project Polaris vector artwork informed by official NASA imagery: wide V-shaped Taurus cluster pattern with Aldebaran-like foreground accent separated from members.</desc>

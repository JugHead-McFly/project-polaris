  <circle cx="200" cy="150" r="78" fill="url(#body)"/><ellipse cx="200" cy="150" rx="140" ry="34" fill="none" stroke="#9ec9bf" stroke-width="6" opacity=".55" transform="rotate(-12 200 150)"/>

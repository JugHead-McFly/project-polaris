<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
  <title id="title">Generic nebula</title>
  <desc id="desc">A stylized nebula used only when no exact target artwork is available.</desc>
